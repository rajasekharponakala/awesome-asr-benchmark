name: Refresh paper metadata

on:
  push:
    branches: [claude/dreamy-edison-pfrdg5, main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch paper metadata (compute)
        run: python scripts/fetch_papers.py
      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/papers.json || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: refresh paper metadata" && git push; fi